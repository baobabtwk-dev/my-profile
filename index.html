<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 페이지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fcfaf6;
            color: #292524;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 32px 16px;
        }

        .container {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(180, 150, 110, 0.08), 0 8px 10px -6px rgba(180, 150, 110, 0.04);
            border: 1px solid #f3ebd9;
            width: 100%;
            padding: 36px 24px 28px 24px;
            text-align: center;
        }

        @media (min-width: 768px) {
            .profile-card {
                width: 290px;
                flex-shrink: 0;
                position: sticky;
                top: 32px;
            }
        }

        .profile-img-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(180, 150, 110, 0.12);
            border: 4px solid #eee1cd;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.55rem;
            font-weight: 800;
            color: #1c1917;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .profile-tagline {
            display: inline-block;
            font-size: 0.825rem;
            font-weight: 600;
            color: #8c673b;
            background-color: #f5ece0;
            padding: 5px 14px;
            border-radius: 9999px;
            margin-bottom: 24px;
        }

        .profile-bio-divider {
            height: 1px;
            background-color: #f5eee4;
            margin: 0 10px 20px 10px;
        }

        .profile-bio {
            font-size: 0.925rem;
            line-height: 1.6;
            color: #57534e;
            word-break: keep-all;
        }

        .travel-container {
            flex: 1;
            min-width: 0;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(180, 150, 110, 0.08), 0 8px 10px -6px rgba(180, 150, 110, 0.04);
            border: 1px solid #f3ebd9;
            padding: 28px 24px;
        }

        .travel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .travel-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .travel-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #1c1917;
            letter-spacing: -0.02em;
        }

        .badge-travel {
            font-size: 0.75rem;
            font-weight: 600;
            color: #8c673b;
            background-color: #f5ece0;
            padding: 3px 10px;
            border-radius: 9999px;
        }

        .sheet-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background-color: #f5ece0;
            color: #78562d;
            border: none;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .sheet-toggle-btn:hover {
            background-color: #ebdcc9;
        }

        .sheet-section {
            background-color: #fcf8f2;
            border-radius: 18px;
            padding: 18px 20px;
            border: 1px solid #f0e6d8;
            margin-bottom: 24px;
        }

        .sheet-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .sheet-label {
            font-size: 0.875rem;
            font-weight: 700;
            color: #292524;
        }

        .sheet-sublabel {
            font-size: 0.75rem;
            color: #a89c8d;
        }

        .sheet-input-group {
            display: flex;
            gap: 8px;
        }

        .sheet-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e7dcd0;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            background-color: #ffffff;
            color: #292524;
            transition: border-color 0.2s;
        }

        .sheet-input:focus {
            border-color: #b86d29;
        }

        .sheet-btn {
            padding: 10px 18px;
            background-color: #c87a32;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .sheet-btn:hover {
            background-color: #b06824;
        }

        .status-message {
            margin-top: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            display: none;
        }

        .status-message.success {
            color: #2f855a;
            display: block;
        }

        .status-message.error {
            color: #dc2626;
            display: block;
        }

        .travel-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (max-width: 520px) {
            .travel-grid {
                grid-template-columns: 1fr;
            }
        }

        .travel-card {
            background-color: #fbf8f3;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #eee5d8;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .travel-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(180, 140, 90, 0.12);
        }

        .travel-img-container {
            width: 100%;
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #f2eade;
        }

        .travel-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .travel-content {
            padding: 10px 4px 4px 4px;
        }

        .travel-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .travel-date {
            color: #b07d4f;
        }

        .travel-place {
            color: #a19585;
            font-weight: 500;
        }

        .travel-desc {
            font-size: 0.925rem;
            font-weight: 700;
            color: #1c1917;
            line-height: 1.4;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 좌측 프로필 영역 -->
        <div class="profile-card">
            <div class="profile-img-container">
                <img id="profile-img" src="profile.jpg" alt="프로필 사진" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=400&auto=format&fit=crop&q=80';">
            </div>
            <h1 class="profile-name" id="profile-name">바오밥</h1>
            <span class="profile-tagline" id="profile-tagline">정보통의 세상이야기</span>
            <div class="profile-bio-divider"></div>
            <p class="profile-bio" id="profile-bio">
                언제나 따뜻한 사람들과 따뜻한 이야기
            </p>
        </div>

        <!-- 2. 우측 메인 컨테이너 (여행 기록 & 시트 연동) -->
        <div class="travel-container">
            <div class="travel-header">
                <div class="travel-title-group">
                    <h2 class="travel-title">나의 여행 기록</h2>
                    <span class="badge-travel">Travel Notes</span>
                </div>
                <button class="sheet-toggle-btn" onclick="toggleSheetSection()">📊 구글 시트 연동</button>
            </div>

            <!-- 구글 시트 연동 박스 -->
            <div class="sheet-section" id="sheet-section">
                <div class="sheet-header-info">
                    <span class="sheet-label">구글 스프레드시트 URL 입력</span>
                    <span class="sheet-sublabel">* '프로필', '여행' 시트 탭 공개 설정 필요</span>
                </div>
                <div class="sheet-input-group">
                    <input type="text" id="sheet-url" class="sheet-input" placeholder="https://docs.google.com/spreadsheets/d/...">
                    <button class="sheet-btn" onclick="fetchGoogleSheetData()">연동하기</button>
                </div>
                <div id="status-msg" class="status-message"></div>
            </div>

            <!-- 여행 기록 카드 그리드 -->
            <div class="travel-grid" id="travel-grid">
                <!-- 카드 1 -->
                <div class="travel-card">
                    <div class="travel-img-container">
                        <img src="20260622_172232.jpg" alt="여행 사진 1" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop&q=80';">
                    </div>
                    <div class="travel-content">
                        <div class="travel-meta">
                            <span class="travel-date">2026.06.22</span>
                            <span class="travel-place">제주도 우도</span>
                        </div>
                        <p class="travel-desc">푸른 에메랄드빛 바다와 섬 속의 작은 섬 우도 산책</p>
                    </div>
                </div>

                <!-- 카드 2 -->
                <div class="travel-card">
                    <div class="travel-img-container">
                        <img src="20260623_110155.jpg" alt="여행 사진 2" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600&auto=format&fit=crop&q=80';">
                    </div>
                    <div class="travel-content">
                        <div class="travel-meta">
                            <span class="travel-date">2026.06.23</span>
                            <span class="travel-place">서귀포 천지연</span>
                        </div>
                        <p class="travel-desc">시원한 폭포 소리와 함께 즐긴 여유로운 아침</p>
                    </div>
                </div>

                <!-- 카드 3 -->
                <div class="travel-card">
                    <div class="travel-img-container">
                        <img src="20260623_110320.jpg" alt="여행 사진 3" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1519046904884-53103b34b206?w=600&auto=format&fit=crop&q=80';">
                    </div>
                    <div class="travel-content">
                        <div class="travel-meta">
                            <span class="travel-date">2026.06.23</span>
                            <span class="travel-place">협재 해수욕장</span>
                        </div>
                        <p class="travel-desc">붉게 물드는 석양을 바라보며 보낸 힐링 타임</p>
                    </div>
                </div>

                <!-- 카드 4 -->
                <div class="travel-card">
                    <div class="travel-img-container">
                        <img src="20260630_113339.jpg" alt="여행 사진 4" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&auto=format&fit=crop&q=80';">
                    </div>
                    <div class="travel-content">
                        <div class="travel-meta">
                            <span class="travel-date">2026.06.30</span>
                            <span class="travel-place">한라산 영실코스</span>
                        </div>
                        <p class="travel-desc">상쾌한 산공기와 기암괴석이 어우러진 멋진 등산</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSheetSection() {
            const sheetSection = document.getElementById('sheet-section');
            if (sheetSection.style.display === 'none') {
                sheetSection.style.display = 'block';
            } else {
                sheetSection.style.display = 'none';
            }
        }

        async function fetchGoogleSheetData() {
            const urlInput = document.getElementById('sheet-url').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!urlInput) {
                showStatus('구글 스프레드시트 URL을 입력해 주세요.', 'error');
                return;
            }

            // 구글 시트 ID 추출
            const matches = urlInput.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (!matches || !matches[1]) {
                showStatus('올바른 구글 스프레드시트 주소가 아닙니다.', 'error');
                return;
            }

            const sheetId = matches[1];
            const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

            try {
                showStatus('데이터를 불러오는 중입니다...', 'success');
                const response = await fetch(gvizUrl);
                const text = await response.text();
                
                const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonText);

                const rows = data.table.rows;

                if (!rows || rows.length === 0) {
                    showStatus('시트에 데이터가 없습니다.', 'error');
                    return;
                }

                // 프로필 관련 및 여행 헤더 인덱스
                let nameIdx = -1, taglineIdx = -1, introIdx = -1, profileImgIdx = -1;
                let dateIdx = -1, placeIdx = -1, storyIdx = -1, imageIdx = -1;
                
                let headerRowIndex = 0;

                if (data.table.cols) {
                    data.table.cols.forEach((col, idx) => {
                        if (col && col.label) {
                            const label = col.label.toLowerCase().trim();
                            if (label === 'name') nameIdx = idx;
                            if (label === 'tagline') taglineIdx = idx;
                            if (label === 'introduction' || label === 'intro') introIdx = idx;
                            if (label === 'profile_image') profileImgIdx = idx;

                            if (label === 'date') dateIdx = idx;
                            if (label === 'place') placeIdx = idx;
                            if (label === 'story') storyIdx = idx;
                            if (label === 'image' || label === 'img') imageIdx = idx;
                        }
                    });
                }

                if (rows[0] && rows[0].c) {
                    let hasHeaderName = false;
                    rows[0].c.forEach((cell, idx) => {
                        if (cell && cell.v !== null && cell.v !== undefined) {
                            const val = String(cell.v).toLowerCase().trim();
                            if (val === 'name') { nameIdx = idx; hasHeaderName = true; }
                            if (val === 'tagline') { taglineIdx = idx; hasHeaderName = true; }
                            if (val === 'introduction' || val === 'intro') { introIdx = idx; hasHeaderName = true; }
                            if (val === 'profile_image') { profileImgIdx = idx; hasHeaderName = true; }

                            if (val === 'date') { dateIdx = idx; hasHeaderName = true; }
                            if (val === 'place') { placeIdx = idx; hasHeaderName = true; }
                            if (val === 'story') { storyIdx = idx; hasHeaderName = true; }
                            if (val === 'image' || val === 'img') { imageIdx = idx; hasHeaderName = true; }
                        }
                    });
                    if (hasHeaderName) {
                        headerRowIndex = 1;
                    }
                }

                if (dateIdx === -1) dateIdx = 0;
                if (placeIdx === -1) placeIdx = 1;
                if (storyIdx === -1) storyIdx = 2;
                if (imageIdx === -1) imageIdx = 3;

                const getVal = (cells, idx) => {
                    if (idx === -1 || !cells || !cells[idx]) return '';
                    const cell = cells[idx];
                    if (cell.v !== null && cell.v !== undefined) return String(cell.v).trim();
                    if (cell.f !== null && cell.f !== undefined) return String(cell.f).trim();
                    return '';
                };

                // 1. 프로필 정보 업데이트
                if (headerRowIndex < rows.length && rows[headerRowIndex] && rows[headerRowIndex].c) {
                    const firstDataCells = rows[headerRowIndex].c;
                    const nameVal = getVal(firstDataCells, nameIdx);
                    const taglineVal = getVal(firstDataCells, taglineIdx);
                    const introVal = getVal(firstDataCells, introIdx);
                    const profileImgVal = getVal(firstDataCells, profileImgIdx);

                    if (nameVal) document.getElementById('profile-name').innerText = nameVal;
                    if (taglineVal) document.getElementById('profile-tagline').innerText = taglineVal;
                    if (introVal) document.getElementById('profile-bio').innerText = introVal;
                    if (profileImgVal) document.getElementById('profile-img').src = profileImgVal;
                }

                const travelGrid = document.getElementById('travel-grid');
                let travelCardsHTML = '';
                let travelCount = 0;

                for (let i = headerRowIndex; i < rows.length; i++) {
                    if (!rows[i] || !rows[i].c) continue;
                    const cells = rows[i].c;

                    const dateVal = getVal(cells, dateIdx);
                    const placeVal = getVal(cells, placeIdx);
                    const storyVal = getVal(cells, storyIdx);
                    const imageVal = getVal(cells, imageIdx);

                    if (dateVal || placeVal || storyVal || imageVal) {
                        const fallbackImg = 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop&q=80';
                        const imgSrc = imageVal || fallbackImg;

                        travelCardsHTML += `
                            <div class="travel-card">
                                <div class="travel-img-container">
                                    <img src="${imgSrc}" alt="${placeVal || '여행 사진'}" onerror="this.onerror=null; this.src='${fallbackImg}';">
                                </div>
                                <div class="travel-content">
                                    <div class="travel-meta">
                                        <span class="travel-date">${dateVal || '날짜 미상'}</span>
                                        <span class="travel-place">${placeVal || '장소 미상'}</span>
                                    </div>
                                    <p class="travel-desc">${storyVal || ''}</p>
                                </div>
                            </div>
                        `;
                        travelCount++;
                    }
                }

                if (travelCount > 0) {
                    travelGrid.innerHTML = travelCardsHTML;
                    showStatus('✓ 성공적으로 연동되었습니다! (프로필, 여행 시트)', 'success');
                } else {
                    showStatus('✓ 연동되었으나 여행 기록 데이터를 찾지 못했습니다.', 'success');
                }

            } catch (err) {
                console.error(err);
                showStatus('데이터를 가져오는데 실패했습니다. 시트 공유 설정을 확인해 주세요.', 'error');
            }
        }

        function showStatus(message, type) {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = message;
            statusMsg.className = `status-message ${type}`;
        }
    </script>
</body>
</html>
